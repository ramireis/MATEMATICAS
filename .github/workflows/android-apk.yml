name: Generar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Comprobar estructura
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          ls -la
          ls -la www
          test -s package.json
          test -s capacitor.config.json
          test -s www/index.html
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar SDK Android existente
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --list_installed
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Instalar dependencias
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx cap --version
      - name: Crear proyecto Android
        shell: bash
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<activity ', '<activity android:screenOrientation="portrait" ', 1)
          p.write_text(s)
          print('Orientación horizontal configurada:', 'sensorLandscape' in s)
          PY
          # Puente nativo: window.AndroidPrint.print() invoca PrintManager.
          # Se genera en cada compilación porque android/ no está versionado.
          python3 - <<'PYJAVA'
          from pathlib import Path
          root=Path('android/app/src/main/java')
          activities=list(root.rglob('MainActivity.java'))
          assert len(activities)==1, f'MainActivity no encontrada o ambigua: {activities}'
          p=activities[0]
          original=p.read_text()
          import re
          pkg=re.search(r'^package\\s+([\\w.]+);',original,re.M)
          assert pkg, 'No se pudo identificar el paquete de Android'
          p.write_text('''package '''+pkg.group(1)+''';

          import android.os.Bundle;
          import android.content.Context;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  webView.addJavascriptInterface(new PrintBridge(webView), "AndroidPrint");
              }

              private class PrintBridge {
                  private final WebView webView;
                  PrintBridge(WebView webView) { this.webView = webView; }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          try {
                              PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (manager == null) throw new IllegalStateException("Servicio de impresión no disponible");
                              manager.print("Reporte_Matematicas", webView.createPrintDocumentAdapter("Reporte_Matematicas"), null);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "No se pudo abrir la impresión: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          ''')
          print('Puente nativo AndroidPrint instalado:',p)
          PYJAVA
          test -f android/gradlew
      - name: Compilar APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --console=plain
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
