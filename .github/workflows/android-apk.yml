name: Generar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Comprobar estructura
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          ls -la
          ls -la www
          test -s package.json
          test -s capacitor.config.json
          test -s www/index.html
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx cap --version
      - name: Crear proyecto Android
        shell: bash
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
      - name: Compilar APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --console=plain
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Matematicas_vs_Zombis_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
