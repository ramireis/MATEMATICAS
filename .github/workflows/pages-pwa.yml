name: Publicar juego web para estudiantes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages-pwa.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar carpeta web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
